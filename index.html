<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Master Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 20px;
            color: #f39c12;
        }
        #game-board {
            display: grid;
            grid-template-columns: repeat(8, 50px);
            grid-template-rows: repeat(8, 50px);
            gap: 4px;
            background-color: #2c2c3e;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .cell {
            width: 50px;
            height: 50px;
            background-color: #3a3a50;
            border-radius: 4px;
        }
        .cell.hovered {
            background-color: #555577;
        }
        .cell.filled {
            background-color: #e74c3c;
        }
        #puzzle-container {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }
        .puzzle-piece {
            width: 50px;
            height: 50px;
            background-color: #3498db;
            border-radius: 6px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .puzzle-piece:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <h1>Block Master Game</h1>

    <div id="game-board"></div>

    <div id="puzzle-container">
        <div class="puzzle-piece" draggable="true" id="piece1">1</div>
        <div class="puzzle-piece" draggable="true" id="piece2">2</div>
        <div class="puzzle-piece" draggable="true" id="piece3">3</div>
    </div>

    <script>
        const board = document.getElementById('game-board');
        const pieces = document.querySelectorAll('.puzzle-piece');

        // বোর্ড তৈরি (৮x৮ গ্রিড)
        for (let i = 0; i < 64; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.dataset.index = i;

            cell.addEventListener('dragover', (e) => {
                e.preventDefault();
                cell.classList.add('hovered');
            });

            cell.addEventListener('dragleave', () => {
                cell.classList.remove('hovered');
            });

            cell.addEventListener('drop', (e) => {
                e.preventDefault();
                cell.classList.remove('hovered');
                
                // ব্লকে কালার সেট করা
                if (!cell.classList.contains('filled')) {
                    cell.classList.add('filled');
                    const pieceId = e.dataTransfer.getData('text/plain');
                    const draggedPiece = document.getElementById(pieceId);
                    if (draggedPiece) {
                        draggedPiece.style.visibility = 'hidden'; // ড্র্যাগ করা ব্লকটি প্যানেল থেকে সরিয়ে নেওয়া
                    }
                }
            });

            board.appendChild(cell);
        }

        // টুকরোগুলো ড্র্যাগ করার ইভেন্ট
        pieces.forEach(piece => {
            piece.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', piece.id);
            });
        });
    </script>
</body>
</html>
