<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Master Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        #game-board {
            width: 320px;
            height: 320px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 2px;
            background-color: #333;
            margin: 20px auto;
            border: 4px solid #333;
            border-radius: 8px;
        }

        .cell {
            background-color: #fff;
            border-radius: 2px;
        }

        .cell.drag-over {
            background-color: #e0e0e0;
        }

        .cell.filled {
            background-color: #4caf50;
        }

        #pieces-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .piece {
            display: grid;
            gap: 2px;
            cursor: grab;
            padding: 10px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .piece:active {
            cursor: grabbing;
        }

        .block {
            width: 30px;
            height: 30px;
            background-color: #2196f3;
            border-radius: 4px;
        }

        .block.empty {
            background-color: transparent;
        }
    </style>
</head>
<body>

    <h1>Block Master Game</h1>
    <p>নিচের ব্লকগুলো টেনে এনে বোর্ডে বসান:</p>

    <div id="game-board"></div>

    <div id="pieces-container"></div>

    <script>
        const board = document.getElementById('game-board');
        const piecesContainer = document.getElementById('pieces-container');
        const BOARD_SIZE = 8;
        let grid = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(false));

        // ৮x৮ গ্রিড বোর্ড তৈরি
        function createBoard() {
            board.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    cell.addEventListener('dragover', handleDragOver);
                    cell.addEventListener('dragleave', handleDragLeave);
                    cell.addEventListener('drop', handleDrop);

                    board.appendChild(cell);
                }
            }
        }

        // টুকরোগুলোর (Pieces) শেপ
        const shapes = [
            [[1, 1], [1, 1]], // ২x২ বর্গ
            [[1, 1, 1]],      // ১x৩ লাইন
            [[1], [1], [1]],  // ৩x১ লাইন
            [[1]]             // ১x১ একক ব্লক
        ];

        let draggedPieceShape = null;
        let draggedPieceElement = null;

        // নিচ থেকে বসানোর জন্য টুকরো তৈরি
        function createPieces() {
            piecesContainer.innerHTML = '';
            shapes.forEach((shape, index) => {
                const piece = document.createElement('div');
                piece.classList.add('piece');
                piece.setAttribute('draggable', 'true');
                piece.style.gridTemplateColumns = `repeat(${shape[0].length}, 30px)`;

                shape.forEach(row => {
                    row.forEach(val => {
                        const block = document.createElement('div');
                        block.classList.add('block');
                        if (val === 0) block.classList.add('empty');
                        piece.appendChild(block);
                    });
                });

                piece.addEventListener('dragstart', (e) => {
                    draggedPieceShape = shape;
                    draggedPieceElement = piece;
                    e.dataTransfer.setData('text/plain', '');
                });

                piecesContainer.appendChild(piece);
            });
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.target.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.target.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.target.classList.remove('drag-over');

            const startRow = parseInt(e.target.dataset.row);
            const startCol = parseInt(e.target.dataset.col);

            if (canPlace(draggedPieceShape, startRow, startCol)) {
                placePiece(draggedPieceShape, startRow, startCol);
                draggedPieceElement.remove();
                if (piecesContainer.children.length === 0) {
                    createPieces(); // সব ব্যবহার হয়ে গেলে আবার নতুন টুকরো তৈরি হবে
                }
            }
        }

        function canPlace(shape, startRow, startCol) {
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c] === 1) {
                        const targetRow = startRow + r;
                        const targetCol = startCol + c;

                        if (targetRow >= BOARD_SIZE || targetCol >= BOARD_SIZE || grid[targetRow][targetCol]) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function placePiece(shape, startRow, startCol) {
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c] === 1) {
                        const targetRow = startRow + r;
                        const targetCol = startCol + c;
                        grid[targetRow][targetCol] = true;

                        const cell = document.querySelector(`[data-row="${targetRow}"][data-col="${targetCol}"]`);
                        if (cell) cell.classList.add('filled');
                    }
                }
            }
        }

        createBoard();
        createPieces();
    </script>
</body>
</html>
