<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Master Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- হেডার (বাম দিকে টপ স্কোর এবং ডান দিকে সেটিংস) -->
    <div class="header-container">
        <div class="top-score-container">
            TOP: <span id="top-score">0</span>
        </div>
        <button class="settings-btn" id="open-settings">⚙️</button>
    </div>

    <!-- পাজেল বোর্ডের ঠিক উপরে মাঝখানে বর্তমান স্কোর -->
    <div class="current-score-container">
        <span id="current-score">0</span>
    </div>

    <!-- পাজেল বোর্ড ও পিস কন্টেইনার -->
    <div id="game-board"></div>
    <div id="pieces-container"></div>

    <!-- সেটিংস মোডাল -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h2>সেটিংস</h2>
            <div class="setting-item">
                <label for="sound-toggle">সাউন্ড ও মিউজিক</label>
                <input type="checkbox" id="sound-toggle" checked>
            </div>
            <div class="setting-item">
                <label for="vibration-toggle">ভাইব্রেশন</label>
                <input type="checkbox" id="vibration-toggle" checked>
            </div>
            <div class="setting-item">
                <label for="theme-select">থিম কালার</label>
                <select id="theme-select">
                    <option value="classic">ক্লাসিক</option>
                    <option value="dark">ডার্ক থিম</option>
                    <option value="neon">নিয়ন থিম</option>
                </select>
            </div>
            <button class="btn" id="close-settings">বন্ধ করুন</button>
        </div>
    </div>

    <!-- গেম ওভার ও অ্যাড মোডাল -->
    <div class="modal" id="game-over-modal">
        <div class="modal-content">
            <h2>গেম ওভার!</h2>
            <p style="margin-bottom: 15px; font-weight: normal;">আপনার স্কোর: <span id="final-score">0</span></p>
            <button class="btn btn-secondary" id="watch-ad-btn">🎬 অ্যাড দেখে রিভাইভ করুন</button>
            <button class="btn" id="restart-btn">পুনরায় শুরু করুন</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
